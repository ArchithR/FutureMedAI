<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>All Blogs - FutureMedAI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b1120;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 2.5rem 3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #ffffff;
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 2rem;
    }

    nav a {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    nav a:hover, nav a.active {
      color: #ffffff;
    }

    main {
      flex: 1;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
      padding: 3rem 2rem 6rem;
    }

    h1 {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 2.5rem;
      color: #ffffff;
    }

    .blog-list {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 2rem;
      text-decoration: none;
      color: inherit;
      display: block;
      transition: border-color 0.2s, transform 0.2s;
    }

    .card:hover {
      border-color: #475569;
      transform: translateY(-2px);
    }

    .card h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
    }

    .back-btn {
      display: inline-block;
      margin-top: 3rem;
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .back-btn:hover {
      text-decoration: underline;
    }

    footer {
      padding: 3rem;
      text-align: center;
      color: #64748b;
      font-size: 0.875rem;
    }

    @media (max-width: 600px) {
      h1 { font-size: 2.25rem; }
      header { padding: 1.5rem; }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="brand-title">FutureMedAI</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="blogs.html" class="active">Blogs</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main>
    <section>
      <h1>All Blogs</h1>
      
      <div class="blog-list">
        <a href="article1.html" class="card">
          <h2>Most Recent Blog</h2>
        </a>
      </div>

      <a href="index.html" class="back-btn">&larr; Back to Home</a>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 FutureMedAI. All rights reserved.</p>
  </footer>

</body>
</html>
