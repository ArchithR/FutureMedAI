<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Title 1 - FutureMedAI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b1120;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 2.5rem 3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #ffffff;
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 2rem;
    }

    nav a {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    nav a:hover {
      color: #ffffff;
    }

    main {
      flex: 1;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      padding: 3rem 2rem 6rem;
    }

    .article-container {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 3.5rem 3rem;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      margin-bottom: 1.5rem;
      color: #ffffff;
      line-height: 1.2;
    }

    .content {
      color: #cbd5e1;
      font-size: 1.1rem;
      line-height: 1.8;
    }

    .content p {
      margin-bottom: 1.5rem;
    }

    .back-btn {
      display: inline-block;
      margin-top: 2.5rem;
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .back-btn:hover {
      text-decoration: underline;
    }

    footer {
      padding: 3rem;
      text-align: center;
      color: #64748b;
      font-size: 0.875rem;
    }

    @media (max-width: 600px) {
      .article-container {
        padding: 2rem 1.5rem;
      }
      header {
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="brand-title">FutureMedAI</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main>
    <article class="article-container">
      <h1>Title 1</h1>
      <div class="content">
        <p>Your full article content will go here. You can write your analysis, research, and thoughts on AI applications in modern healthcare.</p>
      </div>
      <a href="index.html" class="back-btn">&larr; Back to Home</a>
    </article>
  </main>

  <footer>
    <p>&copy; 2026 FutureMedAI. All rights reserved.</p>
  </footer>

</body>
</html>
