<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FutureMedAI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b1120;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 2.5rem 3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #ffffff;
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 2rem;
    }

    nav a {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    nav a:hover, nav a.active {
      color: #ffffff;
    }

    main {
      flex: 1;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: 4rem 2rem 6rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hero {
      text-align: center;
      max-width: 720px;
      margin-bottom: 5rem;
    }

    .hero h1 {
      font-size: 3.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 2rem;
      color: #ffffff;
    }

    .btn-primary {
      display: inline-block;
      background-color: #2563eb;
      color: #ffffff;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.85rem 1.75rem;
      border-radius: 8px;
      text-decoration: none;
      transition: background-color 0.2s, transform 0.15s;
    }

    .btn-primary:hover {
      background-color: #1d4ed8;
      transform: translateY(-1px);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.5rem;
      width: 100%;
      max-width: 720px;
    }

    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 2.5rem 2rem;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      border-color: #475569;
      transform: translateY(-3px);
      box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.5);
    }

    .card h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
    }

    footer {
      padding: 3rem;
      text-align: center;
      color: #64748b;
      font-size: 0.875rem;
    }

    @media (max-width: 650px) {
      .grid {
        grid-template-columns: 1fr;
      }
      .hero h1 { font-size: 2.5rem; }
      header { padding: 1.5rem; }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="brand-title">FutureMedAI</a>
    <nav>
      <a href="index.html" class="active">Home</a>
      <a href="blogs.html">Blogs</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>FutureMedAI</h1>
      <!-- Points to blogs.html -->
      <a href="blogs.html" class="btn-primary">All Blogs</a>
    </section>

    <section class="grid">
      <a href="article1.html" class="card">
        <h2>Most Recent Blog</h2>
      </a>
      <a href="about.html" class="card">
        <h2>About</h2>
      </a>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 FutureMedAI. All rights reserved.</p>
  </footer>

</body>
</html>
